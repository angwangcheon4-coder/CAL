<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>계산기</title>

<style>

body{
    background:#808080;
    font-family:"맑은 고딕";
    text-align:center;
    margin:0;
}

h1{
    color:gold;
    font-size:55px;
    text-shadow:3px 3px 5px black;
    margin-top:30px;
}

#calc{
    width:370px;
    margin:30px auto;
    background:#2f2f2f;
    padding:20px;
    border-radius:20px;
    box-shadow:0px 0px 25px black;
}

#display{
    width:330px;
    height:60px;
    font-size:32px;
    text-align:right;
    margin-bottom:20px;
    border-radius:10px;
    border:none;
    padding-right:10px;
    background:white;
}

button{
    width:75px;
    height:60px;
    margin:5px;
    font-size:24px;
    font-weight:bold;
    border:none;
    border-radius:12px;
    cursor:pointer;
    box-shadow:2px 2px 6px black;
}

.num{
    background:white;
}

.op{
    background:orange;
    color:white;
}

.equal{
    background:green;
    color:white;
}

.clear{
    background:red;
    color:white;
}

button:hover{
    transform:scale(1.05);
}

#name{
    color:lightblue;
    font-size:40px;
    margin-top:40px;
    margin-bottom:30px;
}

</style>

<script>

function add(v){
    document.getElementById("display").value+=v;
}

function clr(){
    document.getElementById("display").value="";
}

function calc(){
    try{
        document.getElementById("display").value=
        eval(document.getElementById("display").value);
    }
    catch{
        alert("계산식이 올바르지 않습니다.");
    }
}

</script>

</head>

<body>

<h1>📐 계산기 📐</h1>

<div id="calc">

<input type="text" id="display" readonly>

<br>

<button class="clear" onclick="clr()">C</button>
<button class="op" onclick="add('(')">(</button>
<button class="op" onclick="add(')')">)</button>
<button class="op" onclick="add('/')">÷</button>

<br>

<button class="num" onclick="add('7')">7</button>
<button class="num" onclick="add('8')">8</button>
<button class="num" onclick="add('9')">9</button>
<button class="op" onclick="add('*')">×</button>

<br>

<button class="num" onclick="add('4')">4</button>
<button class="num" onclick="add('5')">5</button>
<button class="num" onclick="add('6')">6</button>
<button class="op" onclick="add('-')">－</button>

<br>

<button class="num" onclick="add('1')">1</button>
<button class="num" onclick="add('2')">2</button>
<button class="num" onclick="add('3')">3</button>
<button class="op" onclick="add('+')">＋</button>

<br>

<button class="num" onclick="add('0')">0</button>
<button class="num" onclick="add('.')">.</button>
<button class="equal" style="width:160px;" onclick="calc()">=</button>

</div>

<div id="name">
푸른하늘
</div>

</body>
</html>
